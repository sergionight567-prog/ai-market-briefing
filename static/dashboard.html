<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market briefing · AI news intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F16;--panel:#0F1620;--panel2:#141D29;--line:#1F2B3B;--text:#E8ECF2;--muted:#8B97A9;--faint:#5D6A7E;--acc:#F3A64A;--acc2:#FFCB84;--teal:#4FC3B8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0E1520,#0A0F16)}
.mark{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,#F3A64A,#FF7A59,#F3A64A 60%,#FFD08A);display:grid;place-items:center}
.top b{font-size:16px}.top span{color:var(--muted);font-size:13px}
.top .r{margin-left:auto;display:flex;gap:10px}
.btn{padding:9px 14px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--text)}
.btn.p{background:var(--acc);color:#1a1205;border-color:var(--acc)}
.wrap{max-width:1240px;margin:0 auto;padding:26px 32px 60px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi small{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em}.kpi b{display:block;font-size:28px;letter-spacing:-.02em;margin-top:2px}
.kpi i{font-style:normal;color:var(--faint);font-size:12.5px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h4{margin:0 0 14px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:1fr 34px;gap:10px;align-items:center;margin:9px 0;font-size:13px;cursor:pointer}
.bar .l{display:flex;justify-content:space-between;color:var(--text)}
.bar .t{height:6px;border-radius:6px;background:var(--panel2);margin-top:5px;overflow:hidden}.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#FF7A59);border-radius:6px}
.bar b{text-align:right;color:var(--muted);font-weight:500}
.bar.on .l{color:var(--acc2)}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.filters input[type=search]{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px;outline:0}
.filters label{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
input[type=range]{accent-color:var(--acc)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:52px 1fr;gap:16px;transition:.15s}
.item:hover{border-color:#2A3A50}
.score{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--panel2);border:1px solid var(--line)}
.score.hi{background:rgba(243,166,74,.14);border-color:rgba(243,166,74,.45);color:var(--acc2)}
.score.mid{color:var(--text)}.score.lo{color:var(--faint)}
.meta{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meta em{font-style:normal;color:var(--teal)}
.item a{color:var(--text);text-decoration:none;font-weight:600;font-size:15.5px;line-height:1.4;display:block;margin:3px 0 5px}.item a:hover{color:var(--acc2)}
.item p{margin:0;color:#C3CBD7}
.why{margin-top:9px;font-size:13.5px;color:var(--text);background:var(--panel2);border-left:3px solid var(--acc);padding:8px 12px;border-radius:0 10px 10px 0}
.runs{font-size:12.5px;color:var(--muted)}.runs div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.empty{color:var(--muted);padding:30px;text-align:center}
</style></head>
<body>
<div class="top"><div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1205" stroke-width="2.3" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></div>
  <div><b id="ttl">Market briefing</b><br><span id="sub">AI news intelligence</span></div>
  <div class="r"><a class="btn" href="/email" target="_blank">Email digest ↗</a><a class="btn" href="/slack" target="_blank">Slack message ↗</a><button class="btn p" id="runbtn">Run now</button></div></div>
<div class="wrap">
  <div class="kpis"><div class="kpi"><small>Collected</small><b id="k1">-</b><i id="k1s"></i></div><div class="kpi"><small>Worth reading (≥6/10)</small><b id="k2">-</b><i>after AI scoring</i></div>
    <div class="kpi"><small>Top category</small><b id="k3" style="font-size:20px;padding-top:6px">-</b><i id="k3s"></i></div><div class="kpi"><small>Last run</small><b id="k4" style="font-size:20px;padding-top:6px">-</b><i id="k4s"></i></div></div>
  <div class="grid">
    <div><div class="card"><h4>Categories</h4><div id="cats"></div></div><div class="card" style="margin-top:16px"><h4>Recent runs</h4><div class="runs" id="runs"></div></div></div>
    <div><div class="filters"><input type="search" id="q" placeholder="Search titles and summaries…"><label>Min relevance <input type="range" id="min" min="0" max="10" value="5"><b id="minv">5</b></label></div>
      <div id="list"></div></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D={items:[]},cat=null;
const ago=t=>{const h=(Date.now()/1000-t)/3600;return h<1?Math.max(1,Math.round(h*60))+' min ago':h<24?Math.round(h)+' h ago':Math.round(h/24)+' d ago'};
async function load(){D=await (await fetch('/api/latest')).json(); if(!D.runs.length){$('#list').innerHTML='<div class="empty">No runs yet. Press "Run now".</div>';return}
  $('#ttl').textContent=D.company+' · market briefing'; $('#sub').textContent='AI-scored news from '+D.sources.join(', ');
  const r=D.runs[0], rel=D.items.filter(i=>i.relevance>=6);
  $('#k1').textContent=r.collected; $('#k1s').textContent='from '+D.sources.length+' sources, last 36 h';
  $('#k2').textContent=rel.length;
  const cc={}; D.items.filter(i=>i.relevance>=4).forEach(i=>cc[i.category]=(cc[i.category]||0)+1);
  const top=Object.entries(cc).filter(([k])=>k!=='Other').sort((a,b)=>b[1]-a[1])[0]; $('#k3').textContent=top?top[0]:'-'; $('#k3s').textContent=top?top[1]+' relevant stories':'';
  $('#k4').textContent=ago(r.started); $('#k4s').textContent=r.enriched+' items scored by AI';
  const max=Math.max(1,...Object.values(cc));
  $('#cats').innerHTML=D.categories.map(c=>`<div class="bar ${cat===c?'on':''}" data-c="${esc(c)}"><div><div class="l">${esc(c)}</div><div class="t"><i style="width:${100*(cc[c]||0)/max}%"></i></div></div><b>${cc[c]||0}</b></div>`).join('');
  $('#runs').innerHTML=D.runs.map(x=>`<div><span>${new Date(x.started*1000).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span><span>${x.collected} items</span></div>`).join('');
  draw()}
function draw(){const q=$('#q').value.toLowerCase(),min=+$('#min').value;
  const L=D.items.filter(i=>(i.relevance??0)>=min&&(!cat||i.category===cat)&&(!q||(i.title+' '+(i.summary||'')).toLowerCase().includes(q)));
  $('#list').innerHTML=L.length?L.map(i=>{const s=i.relevance??'–',cls=s>=7?'hi':s>=4?'mid':'lo';
    return `<div class="item"><div class="score ${cls}">${s}</div><div><div class="meta"><em>${esc(i.category||'unscored')}</em> · ${esc(i.source)} · ${ago(i.published)}</div>
      <a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><p>${esc(i.summary||i.excerpt)}</p>${i.why?`<div class="why"><b>Why it matters:</b> ${esc(i.why)}</div>`:''}</div></div>`}).join(''):'<div class="empty">Nothing matches these filters.</div>'}
$('#q').oninput=draw; $('#min').oninput=e=>{$('#minv').textContent=e.target.value;draw()};
$('#cats').onclick=e=>{const b=e.target.closest('.bar');if(!b)return;cat=cat===b.dataset.c?null:b.dataset.c;load()};
$('#runbtn').onclick=async()=>{$('#runbtn').textContent='Running…';await fetch('/api/run',{method:'POST'});setTimeout(()=>{$('#runbtn').textContent='Run now';load()},45000)};
load();
</script></body></html>
